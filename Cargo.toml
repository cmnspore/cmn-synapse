[package]
name = "cmn-synapse"
version = "0.2.0"
edition = "2021"
description = "The reference CMN indexer — ingests signed manifests, indexes spores and myceliums, serves discovery queries, and syncs across instances via Nostr."
license = "MIT"
repository = "https://github.com/cmnspore/cmn-synapse"
readme = "README.md"
keywords = ["cmn", "federation", "indexer", "nostr", "search"]
categories = ["web-programming::http-server", "database"]

[lib]
name = "synapse"
path = "src/lib.rs"

[[bin]]
name = "synapse"
path = "src/main.rs"

[features]
default = ["postgres", "redb", "nostr", "ruvector"]
postgres = ["dep:sqlx"]
redb = ["dep:redb"]
nostr = ["dep:nostr-sdk"]
ruvector = ["dep:ruvector-core"]

[dependencies]
# shared library
cmn-substrate = { version = "0.3", features = ["client-safe-dns"] }

# Agent-First Data tracing
agent-first-data = "0.22.0"

# async runtime
tokio = { version = "1.53", features = ["full"] }

# http server
axum = { version = "0.8", features = ["macros", "ws"] }
tower = { version = "0.5", features = ["limit"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }

# database
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono"], optional = true }
redb = { version = "4.1", optional = true }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.2"

# config
config = "0.15"

# crypto
ed25519-dalek = "3.0"
hex = "0.4"

# http client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# cli
clap = { version = "4", features = ["derive"] }

# tls
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pki-types = { version = "1.15", features = ["std"] }

# acme (let's encrypt)
tokio-rustls-acme = { version = "0.9", features = ["axum"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
futures = "0.3"
rcgen = "0.14"
x509-parser = "0.18"

# nostr
nostr-sdk = { version = "0.44", optional = true }

# search
ruvector-core = { version = "2.3", default-features = false, features = ["storage"], optional = true }

# encoding
base64 = "0.22"

# utils
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.27"
bs58 = "0.5"
tokio-tungstenite = "0.30.0"
urlencoding = "2"
wiremock = "0.6"
serial_test = "3"
# hex and serde_jcs are already in dependencies but listed here for clarity in tests

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
