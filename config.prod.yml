# Synapse Configuration
#
# The CMN Federated Indexer and Resilience Layer

# Debug mode
# true: self-signed certs, verbose logging
# false: production settings, requires ACME production mode
debug: false

# Log output format
# json: structured JSON logs (default, recommended for production)
# plain: human-readable plain text logs
log_format: "json"

# Storage backend configuration
storage:
  # Backend: "postgres" or "redb"
  backend: "postgres"

  # PostgreSQL connection URL (required if backend is "postgres")
  postgres_url_secret: "postgres://synapse:U9TeLK7V7FKb08JndIoLtB1DoUXq9n@localhost:5432/synapse"

  # Redb file path (required if backend is "redb")
  redb_path: "synapse.db"

# Cache TTL (seconds)
cache:
  dns_ttl: 3600 # DNS records (1 hour)
  cmn_ttl: 300 # cmn.json (5 minutes)

# Pulse processing
pulse:
  max_clock_skew: 300 # Maximum allowed clock skew (5 minutes)

# HTTP server
# In production with HTTPS enabled, HTTP redirects to HTTPS
# In debug mode without HTTPS, HTTP serves the API directly
http:
  enabled: true
  # Listen address (use [::]:80 for production)
  address: "127.0.0.1:13080"

# HTTPS server (optional)
# Enable for production with automatic certificate management
https:
  enabled: false
  # Listen address (use [::]:443 for production)
  address: "[::]:14443"

  # Self-signed certificate validity (days)
  self_signed_validity_days: 365

  # ACME configuration (Let's Encrypt)
  acme:
    # Contact email for Let's Encrypt notifications
    contact: "support@cmn.dev"
    # Certificate mode:
    # self: auto-generate self-signed (development)
    # staging: Let's Encrypt staging (testing, rate limits relaxed)
    # production: Let's Encrypt production (real certificates)
    mode: "self"
    # Renew certificates this many days before expiry
    renewal_days_before: 30

  # Domain names for certificate
  # Leave empty to use "localhost" (development)
  # domains: []
  # Production example:
  domains:
    - "synapse.cmn.dev"

# Search engine (requires "ruvector" feature + external embedding service)
search:
  enabled: true
  index_path: "/home/ubuntu/synapse/search-index"
  embedding:
    provider: "ollama"
    url: "http://localhost:11434"
    model: "nomic-embed-text"
    dimensions: 768
  graph:
    enabled: true # In-memory spore evolution graph
    rebuild_on_startup: true # Rebuild from storage on boot
    embed_relationships: false # Embed edge descriptions (costs API calls)
    rebuild_batch_size: 100

# Nostr integration (requires "nostr" feature)
# Synapse can act as both a Nostr client and a CMN-only Nostr relay.
nostr:
  enabled: true

  # External Nostr relay URLs to connect to
  relays:
    - "wss://relay.damus.io"
    - "wss://nos.lol"

  # Where to persist the Nostr identity key (secp256k1 nsec).
  # "storage"       — store in the configured database (default)
  # "file:<path>"   — store as a plain file (chmod 0600)
  # Auto-generated on first run if no key exists.
  key_store: "storage"

  # Subscribe to external relays for incoming CMN events
  subscribe: true

  # Forward HTTP pulses to Nostr relays
  forward_pulse: true
